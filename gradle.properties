# The protocol model jars dex to about 4,500 classes; the default 512 MB heap runs out while merging dex.
org.gradle.jvmargs=-Xmx4g
android.useAndroidX=true
# JetBrains Client build that ideate-gradle downloads when jetbrains.client.lib is not set; must be the backend's build.
jetbrains.client.build=263.7307.200
